<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسكين إدارة الأمن - القرية الذكية</title>
    <style>
        :root {
            --primary: #10b981;
            --bg-dark: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --accent: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        .back-btn {
            display: inline-block;
            background-color: #374151;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #4b5563;
            transition: background 0.2s;
        }
        .back-btn:hover { background-color: #4b5563; }
        .header { background-color: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; border-right: 5px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-top: 20px; border: 1px solid #374151; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 14px; border: 1px solid #374151; white-space: nowrap; }
        th { background-color: #2d3748; color: #fff; font-weight: bold; }
        tr:nth-child(even) { background-color: #1a202c; }
        tr:hover { background-color: rgba(59, 130, 246, 0.1); }
        .loading { text-align: center; padding: 30px; color: #9ca3af; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <a href="main.html" class="back-btn">⬅️ العودة لوحة التحكم</a>
    
    <div class="header">
        <h2 style="margin: 0; color: var(--accent);">🏢 ملف التسكين وجرد الغرف - القرية الذكية</h2>
        <p style="margin: 5px 0 0 0; color: #9ca3af; font-size: 14px;">عرض كامل لجميع الأعمدة الخمسة محدثة فورياً عبر سيرفر Google Script</p>
    </div>

    <div class="table-container">
        <div id="loading-msg" class="loading">جاري سحب جداول البيانات المحدثة وفك الحماية الحالية...</div>
        <table id="data-table" style="display:none;">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
// الرابط الجديد كلياً الذي يحتوي على الأعمدة الخمسة كاملة
const apiURL = "https://script.google.com/macros/s/AKfycbymqN_go556fouGUgAxIHox1eocVag4fBnJx9DhJNYFLNPm3_f4g8z_-WA-oCmIgY2a/exec";

fetch(apiURL)
  .then(response => response.json())
  .then(data => {
    if (!data || data.length === 0) {
        document.getElementById("loading-msg").innerText = "لا توجد بيانات متاحة في الجدول حالياً.";
        return;
    }

    let tableHead = document.getElementById("table-head");
    let tableBody = document.getElementById("table-body");
    
    tableHead.innerHTML = "";
    tableBody.innerHTML = "";

    // استخراج أسماء الأعمدة ديناميكياً من أول عنصر في البيانات المخرجة
    let headers = Object.keys(data[0]);
    
    // 1. بناء صف العناوين الرئيسي (Thead) تلقائياً
    let headHtml = "<tr>";
    headers.forEach(header => {
        headHtml += `<th>${header}</th>`;
    });
    headHtml += "</tr>";
    tableHead.innerHTML = headHtml;

    // 2. بناء صفوف البيانات بالكامل (Tbody) لجميع الـ 5 أعمدة
    data.forEach(item => {
        let rowHtml = "<tr>";
        headers.forEach((header, index) => {
            let val = item[header] || "";
            // تنسيقات جمالية مميزة للأعمدة
            if (index === 0) {
                rowHtml += `<td style="font-weight: bold; color: #3b82f6;">${val}</td>`; // العمود الأول بلون أزرق مميز للموقع
            } else if (index === 2) {
                rowHtml += `<td style="color: #10b981; font-weight: 500;">${val}</td>`; // عمود الوظيفة بلون أخضر
            } else {
                rowHtml += `<td>${val}</td>`;
            }
        });
        rowHtml += "</tr>";
        tableBody.innerHTML += rowHtml;
    });

    // إخفاء رسالة التحميل وعرض الجدول المتكامل للجميع
    document.getElementById("loading-msg").style.display = "none";
    document.getElementById("data-table").style.display = "table";
  })
  .catch(error => {
    console.error("Error fetching dynamic 5-column data:", error);
    document.getElementById("loading-msg").innerText = "حدث خطأ أثناء قراءة الأعمدة الديناميكية، يرجى التحديث.";
  });
</script>

</body>
</html>
