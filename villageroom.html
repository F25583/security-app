<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسكين إدارة الأمن - القرية الذكية</title>
    <style>
        :root {
            --primary: #10b981;
            --bg-dark: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --accent: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { width: 100%; max-width: 1000px; margin: 0 auto; }
        .back-btn {
            display: inline-block;
            background-color: #374151;
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #4b5563;
            transition: background 0.2s;
        }
        .back-btn:hover { background-color: #4b5563; }
        .header { background-color: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; border-right: 5px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-top: 20px; border: 1px solid #374151; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 14px; border: 1px solid #374151; white-space: nowrap; }
        th { background-color: #2d3748; color: #fff; font-weight: bold; }
        tr:nth-child(even) { background-color: #1a202c; }
        tr:hover { background-color: rgba(59, 130, 246, 0.1); }
        .loading { text-align: center; padding: 30px; color: #9ca3af; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <a href="main.html" class="back-btn">⬅️ العودة لوحة التحكم</a>
    
    <div class="header">
        <h2 style="margin: 0; color: var(--accent);">🏢 ملف التسكين وجرد الغرف - القرية الذكية</h2>
        <p style="margin: 5px 0 0 0; color: #9ca3af; font-size: 14px;">عرض تلقائي ومحدث فورياً عبر سيرفر Google Script المطور</p>
    </div>

    <div class="table-container">
        <div id="loading-msg" class="loading">جاري سحب جداول البيانات وفك الحماية الحالية...</div>
        <table id="data-table" style="display:none;">
            <thead>
                <tr>
                    <th>رقم الغرفة / الموقع</th>
                    <th>الاسم / البيان</th>
                    <th>القسم / الملاحظات</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
// الرابط الجديد كلياً الذي يعمل ويخرج البيانات العربية بنجاح
const apiURL = "https://script.google.com/macros/s/AKfycbxEPG5a2Sa0KayPmjSc11Odh8GcE9tHC9sLElmKW4v7lueKcJh-eJ0EWqWIzM62u64/exec";

fetch(apiURL)
  .then(response => response.json())
  .then(data => {
    let tableBody = document.getElementById("table-body");
    tableBody.innerHTML = "";
    
    if (data.length === 0) {
        document.getElementById("loading-msg").innerText = "لا توجد بيانات متاحة في الجدول حالياً.";
        return;
    }

    data.forEach(item => {
        // قراءة وتوزيع المفاتيح المطابقة تماماً لملف الـ JSON
        let room = item.room || "";
        let name = item.name || "";
        let job = item.job || "";

        let rowHtml = `<tr>
            <td style="font-weight: bold; color: #3b82f6;">${room}</td>
            <td style="font-weight: 500;">${name}</td>
            <td style="color: #10b981;">${job}</td>
        </tr>`;
        tableBody.innerHTML += rowHtml;
    });

    // إخفاء رسالة الانتظار وعرض الجدول للمستخدمين
    document.getElementById("loading-msg").style.display = "none";
    document.getElementById("data-table").style.display = "table";
  })
  .catch(error => {
    console.error("Error fetching Apps Script API:", error);
    document.getElementById("loading-msg").innerText = "فشل اتصال السيرفر، يرجى التحقق من كود السكريبت.";
  });
</script>

</body>
</html>
