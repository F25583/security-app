<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول - ملفات إدارة الأمن</title>
    <style>
        :root {
            --primary: #10b981;
            --bg-dark: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* شاشة قفل التطبيق */
        #login-screen {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border-top: 5px solid var(--primary);
        }
        h2 {
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #374151;
            background-color: var(--bg-dark);
            color: white;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { 
            background-color: #059669; 
        }
        .error-msg { 
            color: #ef4444; 
            font-size: 14px; 
            margin-top: 15px; 
            display: none; 
        }
        .footer { 
            margin-top: 30px; 
            color: #6b7280; 
            font-size: 11px; 
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول بكلمة المرور -->
    <div id="login-screen">
        <h2>🔒 ملفات إدارة الأمن</h2>
        <p class="subtitle">نظام تتبع الأصول والبيانات الأمنية</p>
        
        <input type="password" id="password-input" placeholder="أدخل كلمة المرور المعتمدة">
        <button onclick="checkPassword()">دخول للنظام</button>
        
        <div id="error-message" class="error-msg">❌ كلمة المرور غير صحيحة، يرجى المحاولة مجدداً.</div>
        
        <div class="footer">جميع الحقوق محفوظة لإدارة الأمن © 2026</div>
    </div>

    <script>
        // كلمة المرور الخاصة بك
        const APP_PASSWORD = "123456"; 

        function checkPassword() {
            const userInput = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-message');

            if (userInput === APP_PASSWORD) {
                // عند نجاح الدخول، يتم الانتقال تلقائياً إلى صفحة الواجهة الرئيسية الجديدة
                window.location.href = "main.html";
            } else {
                errorMsg.style.display = 'block';
            }
        }
        
        // تفعيل زر الإدخال (Enter) من لوحة المفاتيح للدخول السريع
        document.getElementById("password-input").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
