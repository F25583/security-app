<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ملفات إدارة الأمن</title>
    <style>
        :root {
            --primary: #10b981;
            --bg-dark: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --avaya-red: #cc0000; /* اللون الأحمر الرسمي لأفايا */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app-screen { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        .header { background-color: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; border-right: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .grid-item { 
            background-color: var(--card-bg); 
            padding: 30px 15px; 
            border-radius: 12px; 
            text-align: center; 
            cursor: pointer; 
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #374151;
        }
        .grid-item:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
            border-color: var(--primary);
        }
        /* تأثير الحوم المخصص لزر أفايا باللون الأحمر */
        .grid-item.avaya-btn:hover {
            box-shadow: 0 6px 15px rgba(204, 0, 0, 0.4);
            border-color: var(--avaya-red);
        }
        .icon { font-size: 45px; margin-bottom: 12px; }
        
        /* تصميم أيقونة أفايا تجمع بين رمز الهاتف والحرف */
        .avaya-box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 65px;
            height: 65px;
            margin-bottom: 12px;
        }
        .avaya-phone-icon {
            font-size: 40px;
            color: var(--avaya-red);
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }
        .avaya-badge {
            position: absolute;
            bottom: -2px;
            left: -2px;
            background-color: var(--avaya-red);
            color: white;
            font-size: 12px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            padding: 2px 6px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .title { font-size: 16px; font-weight: bold; }
        .footer { text-align: center; margin-top: 40px; color: #6b7280; font-size: 12px; }

        /* تصميم النافذة المنبثقة للفروع (Modal) */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #4b5563;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
        }
        .close-btn:hover { color: #f3f4f6; }
        
        .branch-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .branch-btn {
            background-color: #374151;
            color: var(--text-main);
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #4b5563;
            transition: background 0.2s, border-color 0.2s;
        }
        .branch-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="app-screen">
        <div class="header">
            <h2 style="margin: 0; color: var(--primary);">📋 لوحة التحكم - ملفات إدارة الأمن</h2>
            <p style="margin: 5px 0 0 0; color: #9ca3af; font-size: 14px;">موقع المتابعة الفورية للأصول والبيانات</p>
        </div>

        <div class="grid-container">
            <!-- زر الكاميرات الموجه لصفحة جدول الكاميرات الاحترافي -->
            <a href="cameras.html" class="grid-item">
                <div class="icon">📹</div>
                <div class="title">أماكن وأعداد الكاميرات</div>
            </a>

            <!-- زر أفايا المطور والمرتبط الآن بصفحة جدول الهواتف tele.html بنجاح -->
            <a href="tele.html" class="grid-item avaya-btn">
                <div class="avaya-box">
                    <div class="avaya-phone-icon">☎️</div>
                    <div class="avaya-badge">AVAYA</div>
                </div>
                <div class="title">روابط الإدارة (Avaya)</div>
            </a>

            <!-- زر طفايات وخراطيم الحريق -->
            <a href="extinguishers.html" class="grid-item">
                <div class="icon">🧯</div>
                <div class="title">طفايات وخراطيم الحريق</div>
            </a> 
            
            <!-- زر أعداد الموظفين (مغلق حالياً) -->
            <div class="grid-item" style="opacity: 0.5; cursor: not-allowed;">
                <div class="icon">👥</div>
                <div class="title">أعداد الموظفين (قريباً)</div>
            </div>

            <!-- زر ملف التسكين (تم فتحه لإظهار الفروع) -->
            <div class="grid-item" onclick="openModal()">
                <div class="icon">🚪</div>
                <div class="title">ملف التسكين (الفروع)</div>
            </div>
        </div>
        
        <div class="footer">جميع الحقوق محفوظة لإدارة الأمن © 2026</div>
    </div>

    <!-- النافذة المنبثقة لاختيار الفرع -->
    <div id="branchModal" class="modal" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-top: 0; color: var(--primary);">اختر الفرع المطلوب</h3>
            <div class="branch-buttons">
                <a href="village.html" class="branch-btn">القرية الذكية</a>
                <a href="maadi.html" class="branch-btn">المعادي</a>
                <a href="nasr-city.html" class="branch-btn">مدينة نصر</a>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('branchModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('branchModal').style.display = 'none';
        }
        function closeModalOutside(event) {
            if (event.target.id === 'branchModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
